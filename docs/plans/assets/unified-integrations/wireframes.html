<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>UltraTasks integration wireframes</title>
    <style>
      :root {
        --ink: #23353a;
        --muted: #65777b;
        --line: #c9d2d3;
        --bg: #f5f7f7;
        --paper: #fff;
        --accent: #105f64;
        --tone: #e8f1f1;
        --warn: #735c22;
        --warning: #f8f4e7;
        --r: 10px;
        --s: 8px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: var(--ink);
        background: #e4e9e9;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select {
        outline-offset: 3px;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--accent);
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        padding: 8px 14px;
        min-height: 40px;
      }
      button:hover {
        background: var(--bg);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      button.ghost {
        border-color: transparent;
        background: transparent;
      }
      a {
        color: var(--accent);
      }
      .review {
        height: 64px;
        background: #23353a;
        color: white;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 24px;
      }
      .review strong {
        font-size: 13px;
        white-space: nowrap;
      }
      .review select {
        background: #fff;
        border: 0;
        border-radius: 5px;
        padding: 8px;
        max-width: 470px;
      }
      .review small {
        margin-left: auto;
        color: #d3dfe0;
      }
      .frame {
        min-height: 900px;
        background: var(--bg);
        display: grid;
        grid-template-columns: 224px 1fr;
        position: relative;
      }
      .rail {
        border-right: 1px solid var(--line);
        background: #fff;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .brand {
        font-weight: 750;
        font-size: 20px;
        display: flex;
        gap: 9px;
        align-items: center;
        margin: 0 0 28px 7px;
      }
      .brand-mark {
        border-radius: 7px;
        background: var(--accent);
        color: #fff;
        padding: 2px 8px;
      }
      .nav {
        padding: 9px 12px;
        display: flex;
        gap: 10px;
        text-decoration: none;
        color: var(--ink);
        border-radius: 6px;
        align-items: center;
        min-height: 42px;
      }
      .nav.current {
        background: var(--tone);
        color: var(--accent);
        font-weight: 650;
      }
      .nav .count {
        margin-left: auto;
        font-size: 12px;
        color: var(--muted);
      }
      .rail-label {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
        margin: 24px 12px 6px;
      }
      .subnav {
        padding-left: 40px;
        font-size: 13px;
        color: var(--muted);
      }
      .rail-bottom {
        margin-top: auto;
        padding-top: 30px;
      }
      .screen {
        padding: 32px 40px 34px;
        min-width: 0;
      }
      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        font-weight: 650;
      }
      .heading {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.25;
        letter-spacing: -0.6px;
        margin: 5px 0 8px;
        font-weight: 680;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 12px;
        font-weight: 650;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
      }
      p {
        margin: 0 0 14px;
      }
      .lead {
        max-width: 780px;
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .between {
        justify-content: space-between;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 24px;
        align-items: start;
      }
      .twocol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .threecol {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 24px;
      }
      .compact {
        padding: 16px;
      }
      .note {
        padding: 16px;
        background: var(--tone);
        border-radius: 6px;
        font-size: 13px;
      }
      .warning {
        background: var(--warning);
        color: var(--warn);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 9px;
        font-size: 11px;
        line-height: 20px;
        white-space: nowrap;
        background: white;
      }
      .pill.sync {
        background: var(--tone);
        border-color: #adcbce;
        color: var(--accent);
      }
      .pill.import {
        border-style: dashed;
        color: #566268;
      }
      .pill.neutral {
        background: var(--bg);
        border-color: transparent;
      }
      .pill.warn {
        color: var(--warn);
        background: var(--warning);
      }
      .tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        margin: 0 0 24px;
        padding-bottom: 12px;
        flex-wrap: wrap;
      }
      .tab {
        border: 0;
        background: none;
        padding: 7px 12px;
        color: var(--muted);
      }
      .tab.active {
        background: var(--tone);
        color: var(--accent);
        font-weight: 650;
      }
      .source-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .source-icon {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-weight: 750;
        font-size: 16px;
        background: var(--bg);
        flex-shrink: 0;
      }
      .source-head p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .section-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        margin: 20px 0 8px;
      }
      .task {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 0;
        border-top: 1px solid #e5eaea;
      }
      .task input {
        margin-top: 5px;
        accent-color: var(--accent);
      }
      .task-main {
        flex: 1;
        min-width: 0;
      }
      .task-title {
        font-weight: 550;
        font-size: 14px;
      }
      .task-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
        align-items: center;
        font-size: 12px;
        color: var(--muted);
      }
      .task-more {
        background: transparent;
        border: 0;
        padding: 0 8px;
        min-width: 36px;
        min-height: 32px;
        font-size: 20px;
      }
      .task-extra {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        padding-top: 3px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 0 0 16px;
      }
      .search {
        width: 270px;
        max-width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
      }
      .selection {
        padding: 12px 16px;
        border: 1px solid #aac8ca;
        background: var(--tone);
        border-radius: 8px;
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }
      .selection button {
        font-size: 12px;
        padding: 5px 12px;
        min-height: 34px;
      }
      .stepper {
        display: flex;
        gap: 16px;
        padding: 0 0 24px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        flex-wrap: wrap;
      }
      .step.active {
        color: var(--accent);
        font-weight: 700;
      }
      .step b {
        border: 1px solid var(--line);
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        margin-right: 6px;
      }
      .step.active b {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .provider-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .provider {
        display: flex;
        gap: 12px;
        text-align: left;
        padding: 16px;
      }
      .provider small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .field {
        display: grid;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
      }
      .field input,
      .field select {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        background: #fff;
        width: 100%;
        font-weight: 400;
      }
      .choice {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 20px;
        display: block;
        background: white;
        cursor: pointer;
      }
      .choice.selected {
        border: 2px solid var(--accent);
        padding: 19px;
        background: #f6fafa;
      }
      .choice input {
        accent-color: var(--accent);
        margin: 0 6px 0 0;
      }
      .choice p {
        font-size: 13px;
        color: var(--muted);
        margin: 8px 0 0;
      }
      .checks {
        display: grid;
        gap: 14px;
      }
      .checks label {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .checks input {
        accent-color: var(--accent);
        margin-top: 5px;
      }
      .check-detail {
        font-size: 12px;
        color: var(--muted);
      }
      .footer-actions {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding-top: 24px;
        margin-top: 24px;
        border-top: 1px solid var(--line);
        align-items: center;
      }
      .micro {
        font-size: 12px;
        color: var(--muted);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        text-align: left;
        font-size: 13px;
      }
      th {
        font-weight: 600;
        color: var(--muted);
        font-size: 11px;
        padding: 12px 10px;
        border-bottom: 1px solid var(--line);
      }
      td {
        padding: 14px 10px;
        border-bottom: 1px solid #e4eaea;
        vertical-align: top;
      }
      td select {
        padding: 6px 7px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #fff;
        max-width: 100%;
      }
      td small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
      }
      .linklike {
        border: 0;
        padding: 0;
        min-height: 30px;
        color: var(--accent);
        text-decoration: underline;
        background: none;
        font-size: 12px;
      }
      .breadcrumb {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 18px;
      }
      .mini-line {
        border-top: 1px solid var(--line);
        margin: 16px 0;
      }
      .footer-caption {
        margin-top: 22px;
        font-size: 11px;
        color: var(--muted);
      }
      .modal-shade {
        position: absolute;
        inset: 0;
        background: #23353a55;
        display: grid;
        place-items: center;
        padding: 24px;
        z-index: 5;
      }
      .modal {
        background: white;
        width: 560px;
        max-width: 100%;
        padding: 28px;
        border-radius: 14px;
        box-shadow: 0 8px 40px #23353a33;
      }
      .modal h2 {
        font-size: 22px;
      }
      .modal .footer-actions {
        margin-top: 16px;
      }
      .review-list {
        padding: 14px 16px;
        margin: 16px 0;
        background: var(--bg);
        border-radius: 6px;
      }
      .review-list div {
        padding: 5px 0;
      }
      .policy-line {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #e4eaea;
        font-size: 13px;
      }
      .calendar-block {
        border-left: 3px solid var(--accent);
        background: var(--tone);
        padding: 12px 14px;
        border-radius: 4px;
        margin: 14px 0;
      }
      .calendar-block b {
        font-size: 13px;
      }
      .time {
        font-size: 11px;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: #23353a;
        color: #fff;
        padding: 12px 24px;
        border-radius: 8px;
        z-index: 10;
        font-size: 13px;
        max-width: 90%;
      }
      .mobile-top {
        display: none;
      }
      .tagbox {
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .detail-panel {
        border-left: 1px solid var(--line);
        padding-left: 24px;
      }
      .details-layout {
        display: grid;
        grid-template-columns: 1fr 390px;
        gap: 28px;
      }
      .callout-list {
        padding-left: 18px;
        margin: 10px 0;
      }
      .callout-list li {
        padding: 5px 0;
        font-size: 13px;
      }
      .conflict {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .conflict-head {
        padding: 14px 18px;
        background: var(--bg);
      }
      .conflict-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .conflict-body > div {
        padding: 18px;
      }
      .conflict-body > div + div {
        border-left: 1px solid var(--line);
      }
      .small-select {
        border: 1px solid var(--line);
        padding: 8px;
        border-radius: 6px;
        background: white;
      }
      .hidden {
        display: none !important;
      }
      .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
        margin-right: 5px;
      }
      .mobile-preview {
        display: none;
      }
      .empty {
        padding: 32px;
        text-align: center;
        color: var(--muted);
      }
      .count-inline {
        font-weight: 400;
        color: var(--muted);
        font-size: 12px;
      }
      .fullwidth {
        width: 100%;
      }
      @media (min-width: 1600px) {
        .screen {
          max-width: 1450px;
          width: 100%;
          margin: 0 auto;
        }
      }
      @media (max-width: 1050px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .frame {
          grid-template-columns: 190px 1fr;
        }
        .screen {
          padding: 24px;
        }
        .details-layout {
          grid-template-columns: 1fr;
        }
        .detail-panel {
          border-left: 0;
          padding: 0;
        }
        .provider-grid {
          grid-template-columns: 1fr 1fr;
        }
        .review small {
          display: none;
        }
      }
      @media (max-width: 650px) {
        .review {
          height: 56px;
          padding: 0 12px;
          gap: 12px;
        }
        .review strong {
          font-size: 11px;
        }
        .review select {
          width: 210px;
          font-size: 12px;
        }
        .frame {
          display: block;
          min-height: 850px;
        }
        .rail {
          display: none;
        }
        .mobile-top {
          display: flex;
          padding: 16px 20px;
          border-bottom: 1px solid var(--line);
          background: white;
          justify-content: space-between;
          font-weight: 650;
        }
        .screen {
          padding: 20px 16px 32px;
        }
        h1 {
          font-size: 24px;
        }
        .heading {
          margin-bottom: 20px;
        }
        .heading > button {
          padding: 7px 10px;
          font-size: 12px;
        }
        .threecol,
        .twocol {
          grid-template-columns: 1fr;
        }
        .card {
          padding: 16px;
        }
        .grid {
          gap: 16px;
        }
        .task-extra {
          display: none;
        }
        .task-title {
          font-size: 13px;
        }
        .task-meta {
          gap: 4px;
        }
        .pill {
          font-size: 10px;
          padding: 1px 7px;
        }
        .toolbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
        }
        .search {
          width: 100%;
        }
        .tabs {
          gap: 2px;
          margin-bottom: 16px;
        }
        .tab {
          padding: 6px 9px;
          font-size: 12px;
        }
        .provider-grid {
          grid-template-columns: 1fr;
        }
        .stepper {
          gap: 8px;
        }
        .step {
          font-size: 10px;
        }
        .step b {
          width: 18px;
          height: 18px;
          margin-right: 3px;
        }
        .footer-actions {
          flex-wrap: wrap;
        }
        .screen > aside {
          display: none;
        }
        .selection {
          gap: 8px;
          padding: 10px;
        }
        .selection strong {
          font-size: 12px;
        }
        .modal {
          padding: 20px;
        }
        .modal-shade {
          padding: 16px;
          align-items: start;
          padding-top: 100px;
        }
        .conflict-body {
          grid-template-columns: 1fr;
        }
        .conflict-body > div + div {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
        table {
          font-size: 11px;
        }
        td,
        th {
          padding: 10px 5px;
        }
        td select {
          font-size: 11px;
          width: 100px;
        }
        .details-layout {
          gap: 12px;
        }
        .task {
          gap: 8px;
        }
        .calendar-block {
          margin: 10px 0;
        }
        .stepper .step:not(.active) {
          display: none;
        }
      }
      @media print {
        .review {
          display: none;
        }
        .frame {
          min-height: 0;
        }
        .screen {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="review">
      <strong>WIREFRAMES · PROPOSED UI</strong
      ><select
        id="screen-select"
        aria-label="Choose wireframe"
      ></select
      ><small>Fictional data · no live connections · November 2026</small>
    </div>
    <div
      id="frame"
      class="frame"
    ></div>
    <div
      id="toast"
      class="toast hidden"
      role="status"
    ></div>
    <script>
      const screens = [
        ['workspace', '01 · Integration workspace'],
        ['connect', '02 · Connect an account'],
        ['scope', '03 · Scope and Import or Sync'],
        ['mapping', '04 · Map projects and tags'],
        ['fields', '05 · Field sync policies'],
        ['bulk', '06 · Batch stop tracking'],
        ['calendar', '07 · Calendar modes and conversions'],
        ['detail', '08 · Equal task experience'],
        ['attention', '09 · Resume and resolve differences'],
        ['mobile', '10 · Mobile workspace'],
      ];
      let current = 'workspace',
        filter = 'all',
        source = 'all',
        mode = 'sync',
        provider = 'GitHub',
        calmode = 'sync';
      let selected = new Set();
      let modal = false;
      let tasks = [
        {
          id: 1,
          title: 'Fix keyboard navigation in settings',
          source: 'GitHub',
          project: 'Product app',
          remote: '#142',
          tag: 'accessibility',
          mode: 'sync',
          state: 'active',
        },
        {
          id: 2,
          title: 'Improve search loading states',
          source: 'GitHub',
          project: 'Product app',
          remote: '#163',
          tag: 'frontend',
          mode: 'sync',
          state: 'active',
        },
        {
          id: 3,
          title: 'Review account connection copy',
          source: 'GitHub',
          project: 'Product app',
          remote: '#171',
          tag: 'documentation',
          mode: 'import',
          state: 'active',
        },
        {
          id: 4,
          title: 'Design the project overview',
          source: 'Linear',
          project: 'Website',
          remote: 'WEB-214',
          tag: 'design',
          mode: 'sync',
          state: 'active',
        },
        {
          id: 5,
          title: 'Review accessibility findings',
          source: 'Linear',
          project: 'Website',
          remote: 'WEB-228',
          tag: 'accessibility',
          mode: 'sync',
          state: 'active',
        },
        {
          id: 6,
          title: 'Draft launch checklist',
          source: 'Trello',
          project: 'Marketing',
          remote: 'Card 27',
          tag: 'launch',
          mode: 'import',
          state: 'active',
        },
        {
          id: 7,
          title: 'Collect customer interview notes',
          source: 'Trello',
          project: 'Marketing',

          `<div class="details-layout"><section class="stack"><div class="card compact"><div class="section-label">PLANNED WORK</div>${taskRow(tasks[0], false)}${taskRow(tasks[2], false)}<div class="task"><input type="checkbox" aria-label="Complete local task"><div class="task-main"><div class="task-title">Plan the next release</div><div class="task-meta"><span class="pill neutral">Personal</span><span>Local task</span></div></div></div></div><div class="note">The same scheduling, notes, subtasks, and time tracking are available regardless of origin.</div></section><aside class="detail-panel"><div class="card"><div class="row between">${badge('sync')}<button class="task-more" aria-label="Task menu" onclick="go('bulk')">⋯</button></div><h2 style="margin-top:16px">Fix keyboard navigation in settings</h2><div class="row"><button onclick="toast('Demo timer started')">▶ Start timer</button><button onclick="toast('Schedule this task in the planner')">Schedule</button></div><div class="mini-line"></div><label class="field">Project<select><option>Product app</option></select></label><div class="task-meta" style="margin:16px 0"><span class="pill">#accessibility</span><span class="pill">#my-focus</span></div><label class="field">Private notes<input value="Check focus order with the keyboard"></label><div class="mini-line"></div><h3>GitHub · #142 ↗</h3><p class="micro"><span class="status-dot"></span>Up to date · checked 2 minutes ago</p><div class="policy-line"><span>Title and status</span><span>Receive only</span></div><div class="policy-line"><span>Private notes</span><span>Stay in UltraTasks</span></div><p class="micro" style="margin-top:12px">Completing this task will not close the GitHub issue with the current policy.</p><div class="row"><button onclick="go('fields')">Sync settings</button><button onclick="toast('Task hidden; sync continues')">Hide</button></div><button class="linklike" style="margin-top:12px" onclick="selected=new Set([1]);modal=true;render()">Stop tracking this task</button></div></aside></div>`
        );
      }
      function attention() {
        return (
          heading(
            'Review before resuming',
            'Compare changes made while tracking was stopped. Keep the same local task and history.',
            '',
            'LINEAR · WEB-190',
          ) +
          `<div class="grid"><div class="stack"><div class="note warning"><b>Receive-only connection.</b> Resuming can update UltraTasks from Linear. It will not send local changes back.</div><section class="conflict"><div class="conflict-head"><b>Title changed in both places</b><span class="pill warn" style="float:right">Needs a choice</span></div><div class="conflict-body"><div><div class="eyebrow">ULTRATASKS</div><p style="margin-top:12px"><b>Explore a previous design direction</b></p><label><input type="radio" name="conflict" checked> Keep local title</label></div><div><div class="eyebrow">LINEAR</div><p style="margin-top:12px"><b>Explore the new navigation model</b></p><label><input type="radio" name="conflict"> Use source title</label></div></div></section><section class="card"><h2>Keep your local organization</h2><div class="policy-line"><span>Tracked time</span><b>2h 15m · retained</b></div><div class="policy-line"><span>Private notes</span><b>Retained</b></div><div class="policy-line"><span>Project</span><b>Website</b></div><div class="policy-line"><span>Personal tags</span><b>#my-focus · retained</b></div><p class="micro" style="margin-top:16px">Keeping a local title leaves that field local-only for this task. Other supported fields can continue receiving updates.</p></section><div class="footer-actions"><button onclick="go('workspace')">Keep stopped</button>${primary('Resume with these choices', "toast('Demo: same task reconnected after comparison');go('workspace')")}</div></div><aside class="stack"><div class="card"><h3>What changes now?</h3><p>Remove this item's discovery exclusion and resume the supported field policies.</p><p class="micro">Nothing is duplicated or deleted. Pending edits are compared before any outgoing change.</p></div><div class="note">Connection errors and offline state pause sync. They never change the task into an Imported snapshot.</div></aside></div>`
        );
      }
      function render() {
        let content = {
          workspace,
          mobile: workspace,
          connect,
          scope,
          mapping,
          fields,
          bulk: workspace,
          calendar,
          detail,
          attention,
        }[current]();
        shell(content);
        if (modal) $('#frame').insertAdjacentHTML('beforeend', stopModal());
      }
      $('#screen-select').innerHTML = screens
        .map(([id, t]) => `<option value="${id}">${t}</option>`)
        .join('');
      $('#screen-select').onchange = (e) => go(e.target.value);
      const initial = location.hash.slice(1);
      go(screens.some(([id]) => id === initial) ? initial : 'workspace');
      window.wireframe = { go, render, getTasks: () => tasks };
    </script>
  </body>
</html>
