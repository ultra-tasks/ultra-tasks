name: PR Preview Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    # No app change, nothing to preview.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

# Superseded PR pushes cancel the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Public OAuth client ids for the official sign-in buttons (repository variables OAUTH_<PROVIDER>_CLIENT_ID, not secrets; GitHub forbids a GITHUB_ prefix on variable names).
# Read by tools/load-env.js during `npm run env`; an unset variable hides that provider's button.
env:
  GITHUB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
  GITLAB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_GITLAB_CLIENT_ID }}
  LINEAR_OAUTH_CLIENT_ID: ${{ vars.OAUTH_LINEAR_CLIENT_ID }}
  TRELLO_OAUTH_CLIENT_ID: ${{ vars.OAUTH_TRELLO_CLIENT_ID }}

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-deps

      - name: Generate environment file
        run: npm run env

      - name: Build Frontend for Web
        run: npm run buildFrontend:prodWeb

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-preview-build
          path: dist/browser
          retention-days: 1
