name: Prepare encrypted Play signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Prepare the Google-encrypted key export
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DROID_KEYSTORE_BASE_64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DROID_KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing credential: $name"; exit 1; fi
          done
          echo '0237396cb15eb08ee2c3f89490ff934478e30b03768be85515f09f93b172cd7c  tools/play-signing-encryption-public.pem' | sha256sum --check
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar -o "$RUNNER_TEMP/pepk.jar"
          echo 'aaccc0774b240aa5304bdad2a49865e92f229ca73209ecb6eaafe75dc858e24e  '"$RUNNER_TEMP/pepk.jar" | sha256sum --check
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-source.jks"
          java -jar "$RUNNER_TEMP/pepk.jar" --keystore="$RUNNER_TEMP/play-source.jks" \
            --alias="$KEY_ALIAS" --output="$RUNNER_TEMP/play-encrypted-key.zip" \
            --include-cert --rsa-aes-encryption --encryption-key-path=tools/play-signing-encryption-public.pem \
            --keystore-pass="$KEYSTORE_PASSWORD" --key-pass="$KEY_PASSWORD"
          cert_fingerprint=$(unzip -p "$RUNNER_TEMP/play-encrypted-key.zip" certificate.pem | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$cert_fingerprint" != '3ffa0c8ec1d19f300932a2c8eab2dffdd047704e27d559511884a5f50320f24d' ]; then
            echo '::error::Exported certificate does not match the published Android APK.'
            exit 1
          fi
          test "$(unzip -p "$RUNNER_TEMP/play-encrypted-key.zip" encryptedPrivateKey | wc -c)" -gt 256
          echo 'Verified the exported public certificate matches the published Android APK.'
      - name: Save the encrypted export for Play Console
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-encrypted-signing-key
          path: ${{ runner.temp }}/play-encrypted-key.zip
          if-no-files-found: error
          retention-days: 1
      - name: Remove runner-local key material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/play-source.jks" "$RUNNER_TEMP/play-encrypted-key.zip" "$RUNNER_TEMP/pepk.jar"
