name: Private account sync client acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/app/features/native-sync/**'
      - 'src/app/core/account-login-callback*'
      - 'src/app/core/app-url-open-router*'
      - 'electron/**'
      - 'ios/**'
      - 'android/**'
      - 'src/app/features/config/local-only-sync-settings.util.ts'
      - 'src/app/features/time-tracking/**'
      - 'src/app/op-log/**'
      - 'src/app/imex/sync/**'
      - 'e2e/tests/native-sync/**'
      - 'tools/native-account-test-fixtures.*'
      - 'e2e/tests/sync/ultrasync-provider-migration.spec.ts'
      - 'e2e/tests/sync/ultrasync-provider-save-in-flight.spec.ts'
      - 'e2e/tests/sync/ultrasync-offline-replacement.spec.ts'
      - 'e2e/tests/sync/ultrasync-provider-late-edit.spec.ts'
      - 'packages/sync-providers/**'
      - 'packages/shared-schema/**'
      - 'package*.json'
      - 'tools/*server*'
      - 'tools/sync-server-source.json'
      - '.github/workflows/native-sync-client.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-sync-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-client:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real private server and two Angular clients
        run: npm run quiet -- ultra-private:browser
      - name: Switch between real WebDAV and private account sync
        env:
          E2E_BASE_URL: http://127.0.0.1:4244
          E2E_ULTRA_URL: http://127.0.0.1:4244
          E2E_REQUIRE_WEBDAV: 'true'
          E2E_REQUIRE_ULTRA: 'true'
          E2E_WORKERS: '2'
        run: |
          set -euo pipefail
          npm run quiet -- buildFrontend:e2e
          docker compose up -d --build webdav-e2e
          npm run ultra-provider:harness > .tmp/provider-migration-harness.log 2>&1 &
          harness=$!
          trap 'kill "$harness" 2>/dev/null || true; docker compose stop webdav-e2e' EXIT
          ./scripts/wait-for-webdav.sh
          for attempt in {1..90}; do
            if curl --silent --fail http://127.0.0.1:4244/provider-migration-ready > /dev/null; then break; fi
            if ! kill -0 "$harness" 2>/dev/null; then cat .tmp/provider-migration-harness.log; exit 1; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4244/provider-migration-ready > /dev/null
          npm run quiet -- e2e:file e2e/tests/sync/ultrasync-provider-migration.spec.ts e2e/tests/sync/ultrasync-offline-replacement.spec.ts e2e/tests/sync/ultrasync-provider-late-edit.spec.ts --project=chromium --retries=0
          npm run quiet -- e2e:file e2e/tests/sync/ultrasync-provider-save-in-flight.spec.ts --project=chromium --retries=0
      - name: Legacy client test transport matches extracted server
        run: npm run quiet -- ultra-legacy:parity
      - name: Browser sign-in, MFA and blocked app-return fallback
        run: npm run quiet -- ultra-login:browser
  desktop-login:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run quiet -- buildFrontend:dev
      - run: npm run quiet -- electron:build
      - name: Install the Windows Electron runtime
        run: node node_modules/electron/install.js
      - name: Real Windows app cold/warm browser return and protected pending storage
        shell: pwsh
        run: |
          $env:ULTRA_ELECTRON_EXECUTABLE = (Resolve-Path 'node_modules/electron/dist/electron.exe').Path
          $env:ULTRA_ELECTRON_APP = (Get-Location).Path
          $env:ULTRA_AUTH_SCREENSHOTS = Join-Path (Get-Location).Path '.tmp/account-login-screenshots'
          npm run quiet -- ultra-login:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: windows-account-login-screenshots
          path: .tmp/account-login-screenshots/*.png

  e2e-ultra-accounts:
    name: Native account acceptance (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [sync, verification]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup E2E Environment
        uses: ./.github/actions/setup-e2e

      - name: Build account acceptance bundle
        run: npm run quiet -- buildFrontend:e2e

      # The old client predates both the tracked-time merge and upload batching fixes.
      - name: Check out mixed-version client baseline
        if: matrix.suite == 'sync'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: 5d7a77836e2a03790f75ffd991c74ec3de47183a
          path: .tmp/ultra-account-baseline
          persist-credentials: false

      - name: Build mixed-version client baseline
        if: matrix.suite == 'sync'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 20
          command: |
            set -eu
            cd .tmp/ultra-account-baseline
            npm ci
            npm run quiet -- buildFrontend:e2e
            test -f .tmp/angular-dist/browser/index.html

      - name: Run private account E2E against the disposable server
        env:
          ACCOUNT_SUITE: ${{ matrix.suite }}
          ULTRA_MIGRATION_PORT: '4244'
          ULTRA_MIGRATION_DEVICE_EMAIL: ${{ matrix.suite == 'verification' && '1' || '0' }}
          E2E_ULTRA_VERIFY_DEVICE: ${{ matrix.suite == 'verification' && '1' || '0' }}
          E2E_BASE_URL: http://127.0.0.1:4244
          E2E_ULTRA_URL: http://127.0.0.1:4244
          E2E_ULTRA_BASELINE_DIST: ${{ github.workspace }}/.tmp/ultra-account-baseline/.tmp/angular-dist/browser
          E2E_ULTRA_UPLOAD_BASELINE_DIST: ${{ github.workspace }}/.tmp/ultra-account-baseline/.tmp/angular-dist/browser
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: .tmp/e2e-test-results/ultra-accounts.xml
        run: |
          set -euo pipefail
          mkdir -p .tmp/e2e-test-results
          harness_log=.tmp/e2e-test-results/ultra-accounts-harness.log
          setsid npm run ultra-accounts:harness > "$harness_log" 2>&1 &
          harness=$!
          trap 'kill -- "-$harness" 2>/dev/null || true' EXIT
          if ! timeout 480 bash -c 'until curl -fsS "$E2E_ULTRA_URL/provider-migration-ready" 2>/dev/null \
              | grep -q "\"nativeAccountFixtures\":true"; do
              kill -0 "$1" 2>/dev/null || exit 1
              sleep 1
            done' -- "$harness"; then
            tail -n 60 "$harness_log"
            exit 1
          fi

          if [ "$ACCOUNT_SUITE" = verification ]; then
            specs=(account-device-verification device-verification)
            workers=2
          else
            specs=(first-sync-both-populated first-sync-discovery-failure first-sync-empty-device
              first-sync-interrupted personal-sync-edits personal-sync-tabs personal-sync-upload-size
              session-database-outage)
            # The outage spec disables the fixture database for every account.
            workers=1
          fi
          for i in "${!specs[@]}"; do specs[$i]="e2e/tests/native-sync/${specs[$i]}.spec.ts"; done
          npm run quiet -- e2e:file "${specs[@]}" --project=chromium --workers="$workers" --retries=0 --reporter=line,junit
          grep -Eq '^<testsuites [^>]* tests="[1-9][0-9]*" [^>]*skipped="0" ' "$PLAYWRIGHT_JUNIT_OUTPUT_FILE" \
            || { echo '::error::Private account tests were skipped or none ran'; exit 1; }

      - name: Upload Account E2E Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-ultra-${{ matrix.suite }}-${{ github.run_id }}
          path: .tmp/e2e-test-results/
          retention-days: 30
