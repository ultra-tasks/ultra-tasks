name: Private account sync client acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/app/features/native-sync/**'
      - 'src/app/core/account-login-callback*'
      - 'src/app/core/app-url-open-router*'
      - 'electron/**'
      - 'src/app/op-log/**'
      - 'src/app/imex/sync/**'
      - 'e2e/tests/sync/ultrasync-provider-migration.spec.ts'
      - 'e2e/tests/sync/ultrasync-provider-save-in-flight.spec.ts'
      - 'e2e/tests/sync/ultrasync-offline-replacement.spec.ts'
      - 'e2e/tests/sync/ultrasync-provider-late-edit.spec.ts'
      - 'packages/sync-providers/**'
      - 'packages/shared-schema/**'
      - 'package*.json'
      - 'tools/*server*'
      - 'tools/sync-server-source.json'
      - '.github/workflows/native-sync-client.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-sync-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-client:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Real private server and two Angular clients
        run: npm run quiet -- ultra-private:browser
      - name: Switch between real WebDAV and private account sync
        env:
          E2E_BASE_URL: http://127.0.0.1:4244
          E2E_ULTRA_URL: http://127.0.0.1:4244
          E2E_REQUIRE_WEBDAV: 'true'
          E2E_REQUIRE_ULTRA: 'true'
          E2E_WORKERS: '2'
        run: |
          set -euo pipefail
          npm run quiet -- buildFrontend:e2e
          docker compose up -d --build webdav-e2e
          npm run ultra-provider:harness > .tmp/provider-migration-harness.log 2>&1 &
          harness=$!
          trap 'kill "$harness" 2>/dev/null || true; docker compose stop webdav-e2e' EXIT
          ./scripts/wait-for-webdav.sh
          for attempt in {1..90}; do
            if curl --silent --fail http://127.0.0.1:4244/provider-migration-ready > /dev/null; then break; fi
            if ! kill -0 "$harness" 2>/dev/null; then cat .tmp/provider-migration-harness.log; exit 1; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4244/provider-migration-ready > /dev/null
          npm run quiet -- e2e:file e2e/tests/sync/ultrasync-provider-migration.spec.ts e2e/tests/sync/ultrasync-offline-replacement.spec.ts e2e/tests/sync/ultrasync-provider-late-edit.spec.ts --project=chromium --retries=0
          npm run quiet -- e2e:file e2e/tests/sync/ultrasync-provider-save-in-flight.spec.ts --project=chromium --retries=0
      - name: Legacy client test transport matches extracted server
        run: npm run quiet -- ultra-legacy:parity
      - name: Browser sign-in, MFA and blocked app-return fallback
        run: npm run quiet -- ultra-login:browser
  desktop-login:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run quiet -- buildFrontend:dev
      - run: npm run quiet -- electron:build
      - name: Install the Windows Electron runtime
        run: node node_modules/electron/install.js
      - name: Real Windows app cold/warm browser return and protected pending storage
        shell: pwsh
        run: |
          $env:ULTRA_ELECTRON_EXECUTABLE = (Resolve-Path 'node_modules/electron/dist/electron.exe').Path
          $env:ULTRA_ELECTRON_APP = (Get-Location).Path
          $env:ULTRA_AUTH_SCREENSHOTS = Join-Path (Get-Location).Path '.tmp/account-login-screenshots'
          npm run quiet -- ultra-login:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: windows-account-login-screenshots
          path: .tmp/account-login-screenshots/*.png
