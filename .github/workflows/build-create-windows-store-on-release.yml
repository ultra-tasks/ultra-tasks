name: Windows Store AppX

on:
  push:
    tags:
      - ultra-tasks-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-store-artifact:
    runs-on: windows-latest
    timeout-minutes: 45
    # Public Partner Center identifiers; no signing certificate or Store credentials.
    env:
      WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
      WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
      WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
      WINDOWS_STORE_PACKAGE_FAMILY_NAME: ${{ vars.WINDOWS_STORE_PACKAGE_FAMILY_NAME }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-electron-build
      - name: Validate Store identity and release version
        shell: pwsh
        run: |
          npm run store:check-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            node tools/release-version.js
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm ci
      - name: Validate packaging contracts
        run: npm run quiet -- test:store
      - run: npm run buildFrontend:prod:es6
      - run: npm run electron:build
      - name: Verify Store backup and identity behavior
        run: npm run quiet -- test:electron:file electron/backup.test.cjs electron/windows-store-identity.test.cjs
      - name: Package unsigned x64 and ARM64 AppX files
        run: npm run dist:win:appx:only
      - name: Verify packaged require targets
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem .tmp/store-builds -Filter app.asar -Recurse)
          if ($archives.Count -ne 2) { throw 'Expected x64 and ARM64 app.asar archives' }
          foreach ($archive in $archives) {
            node tools/verify-electron-requires.js $archive.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify submission artifacts and write checksums
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem .tmp/store-builds -Filter *.appx)
          if ($packages.Count -ne 2) { throw 'Expected exactly two AppX packages' }
          foreach ($arch in @('x64', 'arm64')) {
            $matching = @($packages | Where-Object Name -Match "-$arch[.]appx$")
            if ($matching.Count -ne 1) {
              throw "Missing $arch AppX package"
            }
            ./tools/verify-windows-store-package.ps1 -PackagePath $matching[0].FullName -Architecture $arch
          }
          $packages | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content .tmp/store-builds/SHA256SUMS.txt
          @(
            '## Windows Store packages prepared',
            'Download WindowsStore-AppX and upload both .appx files to Partner Center.',
            'These are unsigned Store submissions, not public sideload installers.',
            'This workflow publishes neither a Store submission nor a GitHub release.',
            'See docs/microsoft-store-publishing.md for certification and installation checks.'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload packages for manual Partner Center submission
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WindowsStore-AppX
          path: |
            .tmp/store-builds/*.appx
            .tmp/store-builds/SHA256SUMS.txt
          if-no-files-found: error
