name: Auto Publish to Google Play on Release

on:
  release:
    types: [published]
  # Manual trigger for Android-only releases: promote the build already on the
  # internal track (uploaded by build-android.yml on the ultra-tasks-v* tag push) straight to
  # production, without publishing a GitHub release that would fan out to the
  # desktop/web channels (Docker, snap, web).
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

jobs:
  auto-publish-google-play:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Run on manual dispatch, or for actual (non-pre-) releases.
    if: ${{ github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'ultra-tasks-v') && !github.event.release.prerelease) }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            androidpublisher.googleapis.com:443
            play.google.com:443
            oauth2.googleapis.com:443
            www.googleapis.com:443

      - name: Promote Internal Release to Production
        uses: kevin-david/promote-play-release@d1ed59ca4fd7456b9d8cae062a3684e93b412425 # v1.2.0
        with:
          service-account-json-raw: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: app.ultratasks
          from-track: internal
          to-track: production
          inapp-update-priority: 3
          # Staged rollout: the promoted release reaches 10% of users. Widen it
          # in Play Console (Production, Releases, Update rollout) once the
          # first hours look healthy. The action's default is 1.0, which is
          # every user at once.
          user-fraction: 0.1
