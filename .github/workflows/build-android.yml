name: Build Android APKs and Play Store bundle
on:
  push:
    branches: [main, release/*, test/git-actions]
    tags:
      - ultra-tasks-v*
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional release tag to rebuild'
        type: string
        required: false
      version_code:
        description: 'Optional Android version code for a replacement build'
        type: string
        required: false

permissions:
  contents: write

# Per-ref so rapid non-tag main pushes supersede each other (newest dev build
# wins). Groups are keyed by ref, so a main push can never cancel a `ultra-tasks-v*` tag
# release build (different ref = different group).
concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    # Enable automatic main builds after signing and Play credentials are set up.
    # Manual and tag builds still report missing credentials explicitly.
    if: github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main' || vars.ANDROID_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          # Full commit/tag graph (blobless, so cheap) is needed to derive the
          # per-push dev versionCode from the last stable tag.
          fetch-depth: 0
          filter: blob:none
      - name: Classify fork release tag
        id: release-version
        shell: bash
        run: node tools/release-version.js >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version-file: .nvmrc
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      #      - name: Build with Gradle
      #        run: ./gradlew build
      - name: Setup android-sdk
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true #make accepting the android sdk license verbose
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Get npm cache directory
        id: npm-cache-dir
        run: |
          echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        id: npm-cache # use this to check for `cache-hit` ==> if: steps.npm-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-
      - name: Install npm Packages
        #  if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DROID_KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DROID_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.DROID_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.DROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEYSTORE_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing Android signing credential: $name. See docs/release-and-publishing.md."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks

      # --- Per-push dev build (non-tag main pushes only) --------------------
      # On plain main pushes the release-signed build is otherwise artifact-only;
      # here we stamp it with a dev versionCode and (after Build) ship it to the
      # Play `internal` track so a fresh build auto-updates on the phone. All
      # steps are gated to refs/heads/main (non-tag), so the tag/release path
      # is untouched. The version synchronizer applies the code only at build time.
      - name: Compute dev versionCode
        id: devvc
        # Dev distribution must never redden the release-critical build; on any
        # failure the downstream gates read '' and simply skip.
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        run: node tools/android-dev-version-code.js

      - name: Build
        run: npm run dist:android:prod
        env:
          ANDROID_VERSION_CODE: ${{ inputs.version_code || steps.devvc.outputs.code }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DROID_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.DROID_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.DROID_KEY_PASSWORD }}

      # Keep-rule failures are silent (a stripped @JavascriptInterface method or
      # WorkManager worker builds fine, it just never runs) and android-tests.yml
      # only guards PRs — this workflow ships every main push straight to the
      # Play internal track, so gate the publish on the mapping R8 produced.
      # When minification is on, R8 runs per variant and both flavors ship from
      # main, so check each mapping — playRelease passing says nothing about
      # fdroidRelease. Deliberately NOT continue-on-error: shipping a build with
      # a dead JS bridge is worse than shipping nothing.
      #
      # Minification is OFF today (#9784), so there is nothing to check. Arm the
      # gate from what the build actually emitted rather than from the source
      # text: R8 writes mapping/<variant>/mapping.txt whenever it runs, under any
      # spelling or DSL, so re-enabling it cannot leave this step green-but-blind.
      - name: Verify R8 keep rules survive minification
        run: |
          set -euo pipefail
          shopt -s nullglob
          mappings=(android/app/build/outputs/mapping/*Release/mapping.txt)
          if [ ${#mappings[@]} -eq 0 ]; then
            echo "Minification is off (#9784) — R8 emitted no release mapping, nothing to verify."
            exit 0
          fi
          for variant in playRelease fdroidRelease; do
            echo "--- ${variant}"
            node tools/verify-r8-mapping.mjs \
              "android/app/build/outputs/mapping/${variant}/mapping.txt"
          done

      # Play requires 16 KB-aligned native libraries for apps targeting Android
      # 15+. Misalignment is silent at build time and only surfaces at upload (or
      # as a crash on 16 KB-page devices), so gate the release on it here.
      # `-c` is check-only and `-P 16` needs build-tools 35+; the trailing `4` is
      # zipalign's mandatory <align> argument for everything that is not an .so.
      #
      # Scope, so nobody over-trusts a green run: this checks the *zip entry
      # offset* of uncompressed .so files. A DEFLATED .so reports "OK -
      # compressed" whatever its offset, and zipalign never parses the ELF, so a
      # prebuilt lib with 4 KB p_align also passes (that needs Google's separate
      # check_elf_alignment.sh). AGP stores native libs uncompressed by default,
      # so today — with no .so in the APK at all — this is a cheap guard for the
      # day a plugin adds one, not proof of 16 KB compliance.
      - name: Verify 16 KB native page alignment
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          # Array form, not `ls`: under nullglob an unmatched glob vanishes from
          # the word list, so `ls -1 <glob>` would silently list the CWD instead
          # and hand back a bogus path that passes the -z check below.
          candidates=("${sdk:-/nonexistent}"/build-tools/*/zipalign)
          zipalign=""
          if [ ${#candidates[@]} -gt 0 ]; then
            zipalign="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)"
          fi
          if [ -z "${zipalign}" ]; then
            echo "::error::zipalign not found under ${sdk:-<unset ANDROID_HOME>}/build-tools"
            exit 1
          fi
          apks=(android/app/build/outputs/apk/*/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no release APK found to verify"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "--- ${apk}"
            "${zipalign}" -c -P 16 4 "${apk}"
          done

      - name: Verify release APK signatures and application version
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=("$ANDROID_HOME"/build-tools/*/apksigner)
          test ${#candidates[@]} -gt 0
          signer=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)
          aapt="$(dirname "$signer")/aapt"
          version=$(node -p "require('./package.json').version")
          apks=(android/app/build/outputs/apk/*/release/*.apk)
          test ${#apks[@]} -gt 0
          for apk in "${apks[@]}"; do
            "$signer" verify --verbose --print-certs "$apk"
            package_line=$("$aapt" dump badging "$apk" | sed -n '1p')
            [[ "$package_line" == "package: name='app.ultratasks' "* ]]
            [[ "$package_line" == *"versionName='$version'"* ]]
          done

      # `sync:android` deletes the service-worker files (nothing on Android
      # registers a service worker, and ngsw.json carries a build timestamp that
      # breaks F-Droid's reproducible-build verification, #4155). That strip
      # never fails the build, so assert the outcome on the packaged artifact
      # instead. No PR triggers this workflow, and no PR workflow could host the
      # check: android-tests.yml assembles an APK but substitutes a stand-in
      # smoke page for the Angular bundle, so the assertion would be vacuous.
      - name: 'Verify no service worker shipped in the APK'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/*/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no release APK found to verify"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            # Listing captured first: piping straight into `grep -q` makes grep
            # exit on the first match, unzip die of SIGPIPE, and pipefail report
            # that 141 as the pipeline status — so the `if` reads false and the
            # check passes on exactly the APKs it should catch.
            listing="$(unzip -l "${apk}")"
            if printf '%s\n' "${listing}" \
              | grep -E 'assets/public/(ngsw|safety-worker|worker-basic|sw\.js)'; then
              echo "::error::${apk} ships service-worker assets; the strip in sync:android did not run (#4155)"
              exit 1
            fi
          done

      # APK is now signed automatically by Gradle using signingConfig

      - name: 'Upload APK and AAB files'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sup-android-release
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Verify Play bundle exists
        run: |
          shopt -s nullglob
          bundles=(android/app/build/outputs/bundle/playRelease/*.aab)
          test ${#bundles[@]} -eq 1 || { echo '::error::Expected exactly one Play release AAB'; exit 1; }

      # Ship the dev-versioned AAB to the Play `internal` track (non-tag main
      # pushes only, and only when the versionCode was actually applied). This is
      # the same track the tag build stages real releases on below; dev builds
      # use slots above the previous stable release's code, keeping version codes
      # distinct from the next release. Chosen over a closed
      # track because internal testing skips review, so builds land in minutes.
      - name: Upload dev build to Play (internal track)
        # continue-on-error: re-runs (same commit -> same versionCode, which Play
        # rejects as already used), the post-release window (a just-tagged release
        # has a higher code on this track until the tag propagates to the dev
        # step — closed by `git push --follow-tags`), and transient Play API
        # errors must not fail the release-critical workflow.
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch' && steps.devvc.outputs.skip == 'false'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.ultratasks
          releaseFiles: android/app/build/outputs/bundle/playRelease/*.aab
          releaseName: 'dev ${{ steps.devvc.outputs.code }} (${{ steps.devvc.outputs.sha }})'
          tracks: internal
          status: completed

      - name: Wait for main release to be created
        if: startsWith(github.ref, 'refs/tags/ultra-tasks-v')
        run: |
          echo "Waiting for main release to be created..."
          for i in {1..40}; do
            if gh release view ${{ github.ref_name }} --repo ${{ github.repository }} >/dev/null 2>&1; then
              echo "Release found!"
              break
            fi
            echo "Waiting for release... (attempt $i/40)"
            sleep 30
          done

          # Fail if release still doesn't exist
          if ! gh release view ${{ github.ref_name }} --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "ERROR: Release ${{ github.ref_name }} was not created after 20 minutes"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to existing GitHub Release
        if: startsWith(github.ref, 'refs/tags/ultra-tasks-v')
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/play/release/*.apk)
          # An unmatched glob left the old `for`/`[ -f ]` body unrun and the step
          # green, so a tagged release could ship with no Android APK attached.
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no play release APK found to attach to ${TAG}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "Uploading ${apk} to release ${TAG}"
            # --clobber so re-running a tag build replaces the asset instead of
            # failing on "already exists" — that failure also skipped the Play
            # Console steps below. It deletes before re-uploading, so a failed
            # re-upload loses the old asset; the build artifact is the backup.
            gh release upload "${TAG}" "${apk}" --clobber --repo "${REPO}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - name: Prepare Google Play release notes
        if: steps.release-version.outputs.stable == 'true' && github.event_name != 'workflow_dispatch'
        run: npm run release-notes:prepare-play-store

      - name: Upload to Google Play Console
        if: steps.release-version.outputs.stable == 'true' && github.event_name != 'workflow_dispatch'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.ultratasks
          releaseFiles: android/app/build/outputs/bundle/playRelease/*.aab
          tracks: internal
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: build/generated-release-notes/play-store
