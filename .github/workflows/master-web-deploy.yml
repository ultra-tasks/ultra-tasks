name: Main Web Deploy

# Deploys main to the fork's Cloudflare Pages preview project when configured.
# Domain and hosting setup are separate from the product rename.
on:
  push:
    branches: [main]
    # No app change, nothing to redeploy.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer main push supersedes an in-progress deploy.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy-main:
    if: ${{ vars.ULTRA_TASKS_WEB_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview-deployments

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node Dependencies
        uses: ./.github/actions/setup-deps

      - name: Generate environment file
        run: npm run env

      - name: Build standalone (no-sync) web app
        run: npm run buildFrontend:prodWebStandalone

      - name: Keep the preview out of search indexes
        # Browser data is stored per origin, so the preview must not become a
        # place people keep real tasks. The production app lives at the root of
        # the account origin.
        run: |
          {
            echo '/*'
            echo '  X-Robots-Tag: noindex, nofollow'
          } > dist/browser/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/browser --project-name=ultra-tasks-preview --branch=main
