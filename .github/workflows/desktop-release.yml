name: Desktop GitHub Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign, notarize and verify only the macOS packages. No validation, tag or release.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-github-release
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-electron-build
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
      - run: npm run int:test
      - run: npm run buildFrontend:e2e
      - name: Verify settings and plugin flows
        run: npx playwright test --config e2e/playwright.config.ts e2e/tests/settings/settings-dialog.spec.ts e2e/tests/plugins/plugin-feature-check.spec.ts e2e/tests/plugins/plugin-upload.spec.ts e2e/tests/plugins/plugin-loading.spec.ts e2e/tests/plugins/doc-mode-bundled.spec.ts --workers=2 --retries=0
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-15
            platform: mac
          - os: ubuntu-latest
            platform: linux
    if: ${{ !inputs.dry_run || matrix.platform == 'mac' }}
    runs-on: ${{ matrix.os }}
    # Three notarizations plus the DMG submissions can take a long time.
    timeout-minutes: ${{ matrix.platform == 'mac' && 90 || 40 }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-electron-build
      - name: Check Apple signing credentials
        # Fail in seconds, not after a 30 minute build, and never fall back to an
        # ad-hoc or un-notarized package when a secret is missing or wrong.
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in MAC_CERTS MAC_CERTS_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          p12="$RUNNER_TEMP/check-signing.p12"
          printf '%s' "$MAC_CERTS" | base64 --decode > "$p12"
          certs=$(openssl pkcs12 -in "$p12" -nokeys -passin env:MAC_CERTS_PASSWORD) || {
            rm -f "$p12"
            echo "::error::MAC_CERTS is not a readable .p12, or MAC_CERTS_PASSWORD is wrong"
            exit 1
          }
          rm -f "$p12"
          grep -q 'Developer ID Application' <<<"$certs" || {
            echo "::error::MAC_CERTS does not contain a Developer ID Application certificate"
            exit 1
          }
          grep -q "($APPLE_TEAM_ID)" <<<"$certs" || {
            echo "::error::The certificate does not belong to the team in APPLE_TEAM_ID"
            exit 1
          }
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" > /dev/null || {
            echo "::error::notarytool rejected APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD or APPLE_TEAM_ID"
            exit 1
          }
          echo "Apple signing and notarization credentials accepted"
      - name: Install Linux packaging and display dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb
      - run: npm ci
      - run: npm run buildFrontend:prod:es6
      - run: npm run electron:build
      - name: Package signed and notarized macOS downloads
        if: matrix.platform == 'mac'
        shell: bash
        env:
          # The job-level default disables identity discovery; re-enable it so the
          # imported Developer ID certificate is used instead of skipping signing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # electron-builder notarizes and staples each .app; the DMGs are done below.
          npx electron-builder --config electron-builder.desktop-signed.yaml --mac --publish never
      - name: Notarize and staple the macOS disk images
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(.tmp/app-builds/*.dmg)
          test "${#dmgs[@]}" -eq 3
          for dmg in "${dmgs[@]}"; do
            echo "Notarizing $dmg"
            result=$(xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 45m --output-format json)
            status=$(jq -r .status <<<"$result")
            id=$(jq -r .id <<<"$result")
            echo "Submission $id: $status"
            if [ "$status" != "Accepted" ]; then
              xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
              echo "::error::Apple did not accept $dmg ($status)"
              exit 1
            fi
            xcrun stapler staple "$dmg"
          done
      - name: Package desktop downloads
        if: matrix.platform != 'mac'
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'linux' ]; then
            npx electron-builder --config electron-builder.desktop.yaml --linux AppImage deb rpm --x64 --publish never
          else
            npx electron-builder --config electron-builder.desktop.yaml --${{ matrix.platform }} --publish never
          fi
      - name: Verify packaged require targets
        shell: bash
        run: |
          find .tmp/app-builds -name app.asar -print -exec node tools/verify-electron-requires.js '{}' \;
      - name: Verify macOS signature, notarization and stapling
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail() { echo "::error::$1"; exit 1; }
          check_app() {
            local app="$1" info out
            codesign --verify --deep --strict --verbose=2 "$app"
            info=$(codesign -dv --verbose=4 "$app" 2>&1)
            grep -q 'Authority=Developer ID Application' <<<"$info" || fail "$app is not signed with a Developer ID Application identity"
            grep -q 'Signature=adhoc' <<<"$info" && fail "$app is ad-hoc signed"
            grep -Eq 'flags=.*runtime' <<<"$info" || fail "$app has no hardened runtime"
            out=$(spctl --assess --verbose=4 --type exec "$app" 2>&1) || { echo "$out"; fail "Gatekeeper rejected $app"; }
            echo "$out"
            grep -q 'source=Notarized Developer ID' <<<"$out" || fail "$app is not notarized"
            xcrun stapler validate "$app"
          }
          apps=(.tmp/app-builds/mac*/"Ultra Tasks.app")
          test "${#apps[@]}" -ge 3
          for app in "${apps[@]}"; do
            echo "== $app"
            check_app "$app"
          done
          for dmg in .tmp/app-builds/*.dmg; do
            echo "== $dmg"
            out=$(spctl --assess --verbose=4 --type open --context context:primary-signature "$dmg" 2>&1) || { echo "$out"; fail "Gatekeeper rejected $dmg"; }
            echo "$out"
            xcrun stapler validate "$dmg"
            mountpoint="$(mktemp -d)"
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
            if ! check_app "$mountpoint/Ultra Tasks.app"; then
              hdiutil detach "$mountpoint" || true
              exit 1
            fi
            hdiutil detach "$mountpoint"
            rmdir "$mountpoint"
          done
      - name: Smoke test packaged app
        shell: bash
        run: |
          if [ '${{ matrix.platform }}' = 'win' ]; then
            SOURCE='.tmp/app-builds/win-unpacked'
            EXECUTABLE='Ultra Tasks.exe'
          elif [ '${{ matrix.platform }}' = 'linux' ]; then
            SOURCE='.tmp/app-builds/linux-unpacked'
            EXECUTABLE='ultratasks'
          elif [ "$(node -p process.arch)" = 'arm64' ]; then
            SOURCE='.tmp/app-builds/mac-arm64'
            EXECUTABLE='Ultra Tasks.app/Contents/MacOS/Ultra Tasks'
          else
            SOURCE='.tmp/app-builds/mac'
            EXECUTABLE='Ultra Tasks.app/Contents/MacOS/Ultra Tasks'
          fi
          # The shared smoke test also verifies URLs from a path containing '#'.
          mv "$SOURCE" "${SOURCE} # packaged app"
          APP="${SOURCE} # packaged app/$EXECUTABLE"
          if [ '${{ matrix.platform }}' = 'linux' ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node e2e/electron/packaged-app-smoke.cjs "$APP"
          else
            node e2e/electron/packaged-app-smoke.cjs "$APP"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            .tmp/app-builds/*.exe
            .tmp/app-builds/*.dmg
            .tmp/app-builds/*.zip
            .tmp/app-builds/*.AppImage
            .tmp/app-builds/*.deb
            .tmp/app-builds/*.rpm
          if-no-files-found: error
  publish:
    if: ${{ !inputs.dry_run }}
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          merge-multiple: true
          path: downloads
      - name: Publish verified desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="ultra-tasks-v${VERSION}"
          test "$(find downloads -name '*.exe' | wc -l)" -eq 2
          test "$(find downloads -name '*.dmg' | wc -l)" -eq 3
          test "$(find downloads -name '*.zip' | wc -l)" -eq 2
          test "$(find downloads -name '*.AppImage' | wc -l)" -eq 1
          test "$(find downloads -name '*.deb' | wc -l)" -eq 1
          test "$(find downloads -name '*.rpm' | wc -l)" -eq 1
          (cd downloads && sha256sum * > SHA256SUMS.txt)
          # GITHUB_TOKEN deliberately prevents inherited tag/release workflows
          # from submitting this GitHub-only release to upstream stores.
          gh release create "$TAG" downloads/* --target "$GITHUB_SHA" --title "Ultra Tasks ${VERSION}" --notes-file build/desktop-release-notes.md --draft
          gh release edit "$TAG" --draft=false --latest
