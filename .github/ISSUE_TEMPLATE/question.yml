name: Question
description: Ask a question about Ultra Tasks.
title: 'Question: '
body:
  - type: markdown
    attributes:
      value: |
        Ultra Tasks is maintained by Adrian Chase (@ac9492).
        For vulnerabilities, use [private security reporting](https://github.com/ultra-tasks/ultra-tasks/security/advisories/new).
        Use sample data and leave out personal information, credentials, and private task contents.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where do you need help?
    validations:
      required: true
