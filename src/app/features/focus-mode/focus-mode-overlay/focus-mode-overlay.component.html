<div
  class="focus-mode-dialog"
  role="dialog"
  [attr.aria-label]="T.GCF.APP_FEATURES.FOCUS_MODE | translate"
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
>
  <header>
    <banner></banner>
  </header>
  @if (activePage()) {
    <main>
      <button
        mat-button
        class="close-btn"
        type="button"
        (click)="closeOverlay()"
        [attr.aria-label]="T.F.FOCUS_MODE.HIDE_FOCUS | translate"
      >
        <span class="close-label">{{ T.F.FOCUS_MODE.HIDE_FOCUS | translate }}</span>
        <mat-icon iconPositionEnd>close</mat-icon>
      </button>

      <!-- Mode selector is now integrated into focus-mode-main component -->

      <!-- -->
      @switch (activePage()) {
        <!-- -->
        @case (FocusScreen.Main) {
          <focus-mode-main @warpIn></focus-mode-main>
        }
        @case (FocusScreen.SessionDone) {
          <focus-mode-session-done @warpIn></focus-mode-session-done>
        }
        @case (FocusScreen.Break) {
          <focus-mode-break @warpIn></focus-mode-break>
        }
      }
    </main>
  }
</div>
