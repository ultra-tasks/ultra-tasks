<div
  class="month-label"
  aria-live="polite"
>
  {{ monthLabel() }}
</div>

<div
  class="day-labels"
  role="row"
  aria-hidden="true"
>
  @for (label of dayLabels(); track $index) {
    <div>{{ label }}</div>
  }
</div>
<div
  class="weeks"
  role="grid"
  #weeksContainer
  [style.--row-height]="displayRowHeight() + 'px'"
  [style.max-height.px]="maxHeight()"
>
  <div
    class="weeks-inner"
    [style.transform]="'translateY(' + weekOffset() + 'px)'"
  >
    @for (week of weeks(); track $index) {
      <div
        class="week"
        role="row"
      >
        @for (day of week; track day.dateStr) {
          <button
            role="gridcell"
            [attr.aria-label]="day.dateStr"
            [attr.aria-current]="day.isToday ? 'date' : null"
            [attr.aria-pressed]="day.dateStr === visibleDayDate()"
            [class.is-today]="day.isToday"
            [class.is-active]="day.dateStr === visibleDayDate()"
            [class.is-past]="day.isPast"
            [disabled]="day.isPast && !day.isToday"
            (click)="onDayTap(day.dateStr)"
          >
            {{ day.dayOfMonth }}
            @if (day.hasTasks) {
              <span
                class="task-dot"
                aria-hidden="true"
              ></span>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
<div class="strip-footer">
  <!-- The expand toggle. A tap toggles it, a drag from it still resizes the grid
       by hand (the gesture handler owns both on touch). It spans the row, so the
       chip below lies over its end. -->
  <button
    type="button"
    class="handle"
    [class.is-expanded]="isExpanded()"
    [attr.aria-expanded]="isExpanded()"
    [attr.aria-label]="
      (isExpanded() ? T.F.PLANNER.COLLAPSE_CALENDAR : T.F.PLANNER.EXPAND_CALENDAR)
        | translate
    "
    [disabled]="!isExpanded() && !canExpand()"
    (click)="onHandleClick()"
  >
    <mat-icon aria-hidden="true">expand_more</mat-icon>
  </button>
  @if (showUnscheduled()) {
    <button
      type="button"
      class="unscheduled-chip"
      aria-haspopup="dialog"
      (click)="unscheduledTapped.emit()"
    >
      <mat-icon aria-hidden="true">checklist</mat-icon>
      <span class="label">{{ T.F.PLANNER.UNSCHEDULED_TITLE | translate }}</span>
    </button>
  }
</div>
