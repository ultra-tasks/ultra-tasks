@if (layoutService.isXs()) {
  <planner-calendar-nav
    [visibleDayDate]="planView.visibleDayDate()"
    [daysWithTasks]="daysWithTasks()"
    (dayTapped)="planView.scrollToDay($event)"
  />
}
<div
  class="planner-layout"
  cdkDropListGroup
>
  @if (!layoutService.isXs() && !scope() && unscheduledPanel.isOpen()) {
    <planner-unscheduled-panel />
  }
  <planner-plan-view
    #planView
    [scope]="scope()"
    cdkScrollable
  />
</div>
