<nav
  class="mobile-bottom-nav"
  [class.entrance]="isEntrance()"
>
  <button
    type="button"
    class="nav-button e2e-bottom-nav-today"
    [routerLink]="todayRoute"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    [routerLinkActiveOptions]="{ exact: false }"
  >
    <mat-icon aria-hidden="true">today</mat-icon>
    <span class="nav-label">{{ T.G.TODAY_TAG_TITLE | translate }}</span>
  </button>

  @if (isPlannerEnabled()) {
    <button
      type="button"
      class="nav-button tour-planner e2e-bottom-nav-upcoming"
      routerLink="/planner"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <mat-icon aria-hidden="true">{{ plannerIcon }}</mat-icon>
      <span class="nav-label">{{ T.MH.PLANNER | translate }}</span>
    </button>
  }

  <button
    type="button"
    class="nav-button e2e-bottom-nav-inbox"
    [routerLink]="inboxRoute"
    routerLinkActive="active"
    ariaCurrentWhenActive="page"
    [routerLinkActiveOptions]="{ exact: false }"
  >
    <mat-icon aria-hidden="true">inbox</mat-icon>
    <span class="nav-label">{{ T.G.INBOX_PROJECT_TITLE | translate }}</span>
  </button>

  <!-- Opens the side nav as the phone drawer: projects, tags, Search, the
       right-panel toggles, Settings and everything else that is not a daily
       destination. -->
  <button
    type="button"
    class="nav-button tour-navMenuBtn e2e-bottom-nav-browse"
    [class.active]="layoutService.isMobileSideNavOpen()"
    [attr.aria-expanded]="layoutService.isMobileSideNavOpen()"
    (click)="toggleMobileNav()"
  >
    <mat-icon aria-hidden="true">menu</mat-icon>
    <span class="nav-label">{{ T.MH.BROWSE | translate }}</span>
  </button>
</nav>
