<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>Native session test</title>
  </head>
  <body style="background: white; color: black; font: 28px monospace; padding: 40px 12px">
    <p id="result">Native session test running</p>
    <script>
      // Test-only asset installed into a fresh simulator by native-sync-ios.yml.
      // No network requests, real credentials, or distributed app assets.
      let stage = 'BRIDGE';
      let commandNumber = 0;
      const command = (method, input = {}) => {
        stage = `${++commandNumber} ${method.toUpperCase()}`;
        return window.Capacitor.nativePromise('NativeAccount', 'command', {
          method,
          input,
        });
      };
      const assert = (condition) => {
        if (!condition)
          throw Object.assign(new Error('Unexpected session state'), { code: 'STATE' });
      };
      const absent = async (identity) => {
        let rejected = false;
        try {
          await command('current', identity);
        } catch {
          rejected = true;
        }
        assert(rejected);
      };
      const run = async () => {
        const identity = { serverId: 'ios-test-server', accountId: 'ios-test-account' };
        const baseUrl = 'https://example.invalid';
        await command('clear');
        await command('configure', {
          ...identity,
          baseUrl,
          tokens: {
            accessToken: 'test-access',
            refreshToken: 'test-refresh',
            expiresIn: 600,
          },
        });
        const current = await command('current', identity);
        assert(
          current.accessToken === 'test-access' &&
            current.refreshToken === 'test-refresh',
        );
        assert(
          Number.isInteger(current.expiresIn) &&
            current.expiresIn > 0 &&
            current.expiresIn <= 600,
        );
        await command('bootstrap', {
          ...identity,
          baseUrl,
          refreshToken: 'obsolete-cache',
        });
        assert((await command('current', identity)).refreshToken === 'test-refresh');
        assert((await command('detach', identity)).refreshToken === 'test-refresh');
        await absent(identity);
        await command('bootstrap', {
          ...identity,
          baseUrl,
          refreshToken: 'offline-cache',
        });
        assert((await command('detach', identity)).refreshToken === 'offline-cache');
        await absent(identity);
        await command('login-clear');
        assert((await command('login-load')).value == null);
        const pending = JSON.stringify({
          request: { expiresAt: Date.now() + 120000 },
          verifier: 'synthetic-device-proof',
        });
        await command('login-save', { value: pending });
        assert((await command('login-load')).value === pending);
        // Session cleanup must not consume an independent pending login.
        await command('clear');
        assert((await command('login-load')).value === pending);
        await command('login-clear');
        assert((await command('login-load')).value == null);
        let expiredRejected = false;
        try {
          await command('login-save', {
            value: JSON.stringify({ request: { expiresAt: Date.now() - 1 } }),
          });
        } catch {
          expiredRejected = true;
        }
        assert(expiredRejected);
        document.getElementById('result').textContent = 'ULTRA NATIVE KEYCHAIN PASS';
      };
      const start = async () => {
        for (let attempt = 0; attempt < 40; attempt++) {
          if (window.Capacitor?.nativePromise) break;
          await new Promise((resolve) => setTimeout(resolve, 250));
        }
        try {
          assert(window.Capacitor?.isPluginAvailable('NativeAccount'));
          await run();
        } catch (error) {
          const code = /^[A-Z_0-9-]{1,32}$/.test(String(error?.code))
            ? error.code
            : 'COMMAND';
          document.getElementById('result').textContent =
            `ULTRA NATIVE KEYCHAIN FAILED. STAGE ${stage}. CODE ${code}`;
        }
      };
      void start();
    </script>
  </body>
</html>
